<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSONPlaceholder · Usuarios</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%);
      min-height: 100vh;
    }
    .card-user {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card-user:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
    }
    .avatar-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #0d6efd;
      color: #fff;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
  </style>
</head>

<body>
  <div class="container py-5">
    
    <header class="text-center mb-5">
      <h1 class="display-5 fw-bold text-primary">👥 Usuarios de JSONPlaceholder</h1>
      <p class="lead text-muted">
        Consumo de API REST con <code>fetch()</code> + TypeScript + interfaces
      </p>
      <span id="contador" class="badge bg-primary fs-6"></span>
    </header>

    
    <div id="estado" class="text-center text-muted my-4"></div>

   
    <main id="app" class="row g-4"></main>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>

  <script type="module" src="./dist/main.js"></script>
</body>
</html>
